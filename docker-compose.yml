services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: po_assistant
      POSTGRES_USER: po_user
      POSTGRES_PASSWORD: po_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po_user -d po_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: taskflow-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: taskflow-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: taskflow-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-taskflow.json:/opt/keycloak/data/import/realm-taskflow.json:ro

  # Optional E4 services (also runnable via docker run — see research/E4_DEPENDENCIES.md)
  postgres-external:
    profiles: ["e4"]
    image: postgres:16-alpine
    container_name: taskflow-postgres-external
    environment:
      POSTGRES_DB: external_demo
      POSTGRES_USER: external_user
      POSTGRES_PASSWORD: external_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_external_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U external_user -d external_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    profiles: ["e4"]
    image: docker.n8n.io/n8nio/n8n
    container_name: taskflow-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Yekaterinburg
      # Set after: python backend/scripts/issue_integration_jwt.py
      - TASKFLOW_SERVICE_JWT=${TASKFLOW_SERVICE_JWT:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/integrations:/data/integrations
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # E5: Kafka-compatible broker for durable indexing events (host port 19092)
  redpanda:
    profiles: ["e5"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: taskflow-redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # E7: MinIO S3-compatible object storage for uploads
  minio:
    profiles: ["e7"]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: taskflow-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  postgres_external_data:
  n8n_data:
  redpanda_data:
  minio_data:
